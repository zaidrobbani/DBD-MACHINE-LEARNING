project:
  name: "MLOps-DBD"
  seed: 42
  timezone: Asia/Jakarta

location:
  name: Malang, Jawa Timur
  latitude: -7.9666
  longitude: 112.6326

wikipedia:
  project: id.wikipedia.org
  article: Demam_berdarah_dengue
  access: all-access
  agent: user
  granularity: daily
  user_agent: "dbd-mlops-pipeline/1.0 (contact: zaidrabbani65@student.ub.ac.id)"

paths:
  raw_dataset: "data/raw/dataset.csv"        # dataset kumulatif, versinya dilacak DVC
  interim_dataset: "data/interim/dataset_clean.csv"
  processed_path: "data/processed/features.csv"
  validation_dir: "data/validation"
  model_path: "models/model.pkl"
  metrics_path: "models/metrics.json"
  forecast_plot_path: "models/forecast_test.png"

open_meteo:
  # Forecast API hanya menyimpan ~3 bulan ke belakang, jadi histori panjang
  # diambil dari Archive API (ERA5). Forecast API dipakai untuk mengisi
  # beberapa hari terakhir yang belum tersedia di archive.
  # Variabel cuaca yang diambil didefinisikan di src/schema.py.
  base_url: https://api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_max_past_days: 80

ingestion:
  days_back: 14          # ingest harian (incremental)
  history_days: 730      # backfill histori untuk training (--backfill)
  end_date_offset_days: 2

preprocessing:
  max_interpolate_gap_days: 3

# Aturan validasi dipakai di dua titik: data mentah (validate_dataset)
# dan data bersih (preprocess). Kolom wajib didefinisikan di src/schema.py.
validation:
  min_rows: 14
  max_missing_ratio: 0.05
  max_duplicate_dates: 0
  max_staleness_days: 7
  ranges:
    page_views: [0, null]
    precipitation_sum: [0, 500]
    temperature_mean: [-10, 45]
    relative_humidity_mean: [0, 100]

features:
  # Target: rata-rata page_views 7 hari ke depan (t+1 .. t+7),
  # semua fitur hanya memakai informasi sampai hari t.
  horizon_days: 7
  page_view_lags: [1, 2, 3, 7, 14]
  page_view_windows: [7, 14, 28]
  weather_windows: [7, 14, 28]
  weather_lag_window: 14   # agregat cuaca yang digeser (efek jeda 1-3 minggu)
  weather_lags: [7, 14]

split:
  # Validasi temporal: data paling akhir jadi test set, tidak di-shuffle.
  test_days: 90
  cv_folds: 5
  min_train_rows: 180

model:
  type: "random_forest"   # random_forest | gradient_boosting | ridge
  # Baseline naif: "minggu depan = rata-rata 7 hari terakhir". Model dibandingkan
  # dengan baseline ini, dan (jika residual: true) memprediksi selisih terhadapnya,
  # karena level page_views bergeser antar tahun.
  baseline_feature: "pv_mean_7"
  residual: true
  refit_on_full_data: true
  # Hyperparameter dipilih lewat CV temporal pada data train, bukan dari test set.
  # random_state diambil dari project.seed.
  params:
    random_forest:
      n_estimators: 300
      max_depth: 4
      min_samples_leaf: 30
      max_features: 0.5
      n_jobs: -1
    gradient_boosting:
      max_iter: 300
      learning_rate: 0.05
      max_depth: 4
    ridge:
      alpha: 1.0
