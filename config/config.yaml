project:
  name: "MLOps-DBD"
  seed: 42
  timezone: Asia/Jakarta

location:
  name: Malang, Jawa Timur
  latitude: -7.9666
  longitude: 112.6326

wikipedia:
  project: id.wikipedia.org
  article: Demam_berdarah_dengue
  access: all-access
  agent: all-agents
  granularity: daily
  user_agent: "dbd-mlops-pipeline/1.0 (contact: zaidrabbani65@student.ub.ac.id)"

open_meteo:
  base_url: https://api.open-meteo.com/v1/forecast
  daily_variables:
    - temperature_2m_mean
    - precipitation_sum
    - relative_humidity_2m_mean

ingestion:
  api_url: "https://api.example.com/dbd-cases"
  api_key_env: "DBD_API_KEY"
  raw_dir: "data/raw"
  params: {}
  output_dir: "data/raw"
  days_back: 14
  end_date_offset_days: 2

preprocessing:
  input_dir: "data/raw"
  output_dir: "data/interim"
  min_rows: 10
  missing_value_threshold: 0.05

validation:
  required_columns: ["date", "region", "cases", "target"]
  min_rows: 50
  max_missing_ratio: 0.05
  max_duplicate_ratio: 0.10

data:
  raw_path: "data/raw/latest.csv"
  interim_path: "data/interim/dataset_clean.csv"
  processed_path: "data/processed/dataset_features.csv"
  target_column: "target"
  test_size: 0.2

model:
  type: "random_forest"
  output_path: "models/model.pkl"
  params:
    n_estimators: 200
    max_depth: 10
    random_state: 42

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
