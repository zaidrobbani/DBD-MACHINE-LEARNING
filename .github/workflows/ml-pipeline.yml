name: ML Pipeline (Ingest -> Validate -> Train)

# Trigger:
# - schedule: cron berjalan otomatis berkala untuk menarik data baru dari API
# - workflow_dispatch: bisa dipicu manual dari tab Actions kapan pun perlu
on:
  schedule:
    - cron: "0 3 * * *"   # tiap hari jam 03:00 UTC -- sesuaikan kebutuhan
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.11"

jobs:
  ingest:
    name: Data Ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data from API
        env:
          DBD_API_KEY: ${{ secrets.DBD_API_KEY }}
        run: python -m src.ingestion.fetch_data

      - name: Upload raw data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          retention-days: 14

  validate:
    name: Data Validation (gate)
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download raw data snapshot
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/

      # Job ini akan exit non-zero jika validasi gagal -> job `train`
      # otomatis di-skip karena bergantung (needs) pada job ini.
      - name: Run validation gate
        run: python -m src.data.validate_dataset

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: data/validation/
          retention-days: 14

  train:
    name: Train Model
    needs: validate   # hanya jalan jika job `validate` sukses (data lolos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download raw data snapshot
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/

      - name: Build features
        run: python -m src.features.build_features

      - name: Train model
        run: python -m src.models.train_model

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          retention-days: 30
