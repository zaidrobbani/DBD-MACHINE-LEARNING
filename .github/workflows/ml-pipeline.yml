name: ML Pipeline (CI -> Ingest -> Validate -> Train)

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # CI: kualitas kode + unit test (tanpa akses jaringan).
  test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit test (pytest)
        run: python -m pytest -q

  # CT: tarik data terbaru -> validasi (gate) -> latih ulang model.
  ingest:
    name: Data Ingestion
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      # Runner GitHub selalu mulai kosong (data/raw tidak di-commit dan remote
      # DVC masih lokal), jadi histori training diambil ulang lewat --backfill.
      - name: Fetch Wikipedia Pageviews + Open-Meteo
        run: python -m src.ingestion.ingestion_data --backfill

      - name: Upload raw data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/*.csv
          retention-days: 14

  validate:
    name: Data Validation (gate)
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Download raw data snapshot
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/

      - name: Run validation gate
        run: python -m src.data.validate_dataset

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: data/validation/*.json
          retention-days: 14

  train:
    name: Train Model
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Download raw data snapshot
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/

      - name: Preprocess
        run: python -m src.data.preprocess

      - name: Build features
        run: python -m src.features.build_features

      - name: Train model (validasi temporal)
        run: python -m src.models.train_model

      - name: Forecast 7 hari ke depan
        run: python -m src.models.predict_model

      - name: Ringkasan metrik
        run: |
          {
            echo "### Hasil training"
            echo '```json'
            python -c "import json; m=json.load(open('models/metrics.json')); m.pop('cv'); print(json.dumps(m, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/*
          retention-days: 30
